[project]
name = "devpulse"
version = "0.1.0"
description = "Desktop widget for monitoring OpenCode usage."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.9",
    "httpx>=0.28",
]

[project.scripts]
devpulse = "devpulse.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires a real OpenCode instance"]
